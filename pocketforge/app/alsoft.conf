# OpenAL Soft configuration for MBHaxe on PocketForge OS handhelds (OpenAL Soft 1.19+).
#
# PocketForge OS has no PulseAudio or PipeWire: audio is raw ALSA, and the default
# PCM is plug -> softvol -> dmix at 48 kHz S16_LE, 1024-frame periods (x4) on the
# on-SoC codec. OpenAL Soft therefore uses its ALSA backend only, on the "default"
# PCM, mixing at the dmix rate so ALSA does not resample.
#
# The app launcher points OpenAL Soft at this file with
#   ALSOFT_CONF=<app dir>/alsoft.conf
# OpenAL Soft reads ALSOFT_CONF last, after /etc/openal/alsoft.conf and the per-user
# ~/.alsoftrc and ~/.config/alsoft.conf, so the keys set here override those files
# and every key not set here keeps its earlier or built-in value.
#
# rt-prio is left at the OpenAL Soft default: the mixer thread asks for real-time
# priority where RTKit or RLIMIT_RTPRIO allows it. Do not test this file against an
# ALSA "null" PCM with real-time priority granted: that PCM never blocks, the mixer
# thread spins, and the kernel kills the game with SIGKILL when RLIMIT_RTTIME runs out.

[general]
drivers = alsa
frequency = 48000
channels = stereo
sample-type = int16
period_size = 1024
periods = 4
hrtf = false

[alsa]
device = default
