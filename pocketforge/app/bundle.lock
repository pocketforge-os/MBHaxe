# Debian bookworm libraries bundled in the MBHaxe app root (lib/), tsp-0qwbh.5.
#
# marblegame and its hdlls need these sonames, and the PocketForge image does not install them
# (image rootfs-packages*.txt closure, recorded in LOCK.md). Bundling them keeps the image
# unchanged. They are the exact .debs the build sysroot links against: the same snapshot
# (pins.lock PF_DEBIAN_SNAPSHOT) and sha256, which app-root.sh cross-checks against the
# sysroot's debs.sha256 when it runs inside build.sh. libsndio7.0 is here because libopenal1
# needs libsndio.so.7.0; its own dependencies (libasound2, libbsd0, libmd0) are in the image.
#
# app-root.sh downloads each .deb from
#   http://snapshot.debian.org/archive/debian/<PF_DEBIAN_SNAPSHOT>/<pool path>
# (plain http, like sysroot.sh: integrity is the sha256 and size pinned here), extracts
# usr/lib/<triple>/<needed-name> with symlinks dereferenced to lib/<needed-name>, and copies
# usr/share/doc/<package>/copyright to licenses/debian/<package>.copyright.
#
# Columns: arch package version sha256 size needed-name pool-path
# needed-name is the file name the dependants' DT_NEEDED asks for and the name it gets in lib/
# (libsndio.so.7.0 is Debian's compatibility name; the library's SONAME is libsndio.so.7).
